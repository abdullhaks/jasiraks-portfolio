  <body>
    <!-- Clean up stale service workers from previous projects on this port -->
    <script>
      if ('serviceWorker' in navigator) {
        // Force-register a self-destructing SW to replace any stale one
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .catch(function() {});
        // Also directly unregister all SWs
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var hadSW = registrations.length > 0;
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
          // Clear all caches
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
              if (hadSW) window.location.reload();
            });
          } else if (hadSW) {
            window.location.reload();
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
